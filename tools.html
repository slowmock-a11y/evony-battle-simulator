<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evony Tools — Coordinate Formatter</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 0 1rem 2rem;
        }
        h1, h2, h3 { font-weight: 600; }

        header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 0.4rem;
            padding: 0.5rem 0;
        }
        .header-left { display: flex; align-items: baseline; gap: 0.6rem; }
        header h1 { font-size: 1.2rem; color: #e94560; }
        header .subtitle { font-size: 0.78rem; color: #888; }
        .back-link {
            color: #888; text-decoration: none; font-size: 0.85rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: #e94560; }

        main {
            max-width: 800px;
            margin: 1.5rem auto 0;
        }

        .tool-card {
            background: #16213e;
            border: 1px solid #223;
            border-radius: 6px;
            padding: 1.5rem 2rem;
        }

        .tool-card h2 {
            font-size: 1.1rem;
            color: #e94560;
            margin-bottom: 0.3rem;
        }

        .tool-desc {
            font-size: 0.82rem;
            color: #888;
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.82rem;
            color: #999;
            margin-bottom: 0.35rem;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #0f1629;
            border: 1px solid #334;
            border-radius: 4px;
            color: #eee;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            padding: 0.6rem 0.75rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.15s;
        }
        textarea:focus { border-color: #e94560; }

        .options-row {
            display: flex;
            gap: 2rem;
            margin: 1rem 0 1.25rem;
            flex-wrap: wrap;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .option-group legend {
            font-size: 0.78rem;
            color: #777;
            margin-bottom: 0.25rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .radio-row {
            display: flex;
            gap: 1rem;
        }

        .radio-row label {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin: 0;
            cursor: pointer;
            color: #ccc;
            font-size: 0.85rem;
        }

        input[type="radio"] {
            accent-color: #e94560;
            cursor: pointer;
        }

        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.35rem;
        }

        .output-label {
            font-size: 0.82rem;
            color: #999;
        }

        .copy-btn {
            background: #16213e;
            border: 1px solid #334;
            color: #999;
            padding: 0.25rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .copy-btn:hover { background: #1a2a4a; color: #ddd; border-color: #556; }
        .copy-btn.copied { background: #1a3a2a; color: #4caf6e; border-color: #2a5a3a; }

        .output-box {
            width: 100%;
            min-height: 180px;
            background: #0f1629;
            border: 1px solid #334;
            border-radius: 4px;
            color: #eee;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            padding: 0.6rem 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
        }

        .stats {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.5rem;
            text-align: right;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>Evony Tools</h1>
            <span class="subtitle">Coordinate Formatter</span>
        </div>
        <a href="index.html" class="back-link">&#8592; Battle Simulator</a>
    </header>

    <main>
        <div class="tool-card">
            <h2>Coordinate Formatter</h2>
            <p class="tool-desc">Moves trailing coordinates to the start of each line so Evony chat recognizes them as clickable links.</p>

            <label for="input">Input — one entry per line, ending with x y coordinates (0–1200)</label>
            <textarea id="input" placeholder="Ruined Stronghold 456 789&#10;Iron Mine T4 1200 0&#10;Alliance HQ 33 1100"></textarea>

            <div class="options-row">
                <fieldset class="option-group" style="border:none">
                    <legend>Trailing comma</legend>
                    <div class="radio-row">
                        <label><input type="radio" name="comma" value="yes" checked> on</label>
                        <label><input type="radio" name="comma" value="no"> off</label>
                    </div>
                </fieldset>

                <fieldset class="option-group" style="border:none">
                    <legend>Line ending</legend>
                    <div class="radio-row">
                        <label><input type="radio" name="lineend" value="crlf" checked> Windows (CRLF)</label>
                        <label><input type="radio" name="lineend" value="lf"> Linux (LF)</label>
                    </div>
                </fieldset>
            </div>

            <div class="output-header">
                <span class="output-label">Output</span>
                <button class="copy-btn" id="copyBtn">Copy</button>
            </div>
            <div class="output-box" id="output"></div>
            <div class="stats" id="stats"></div>
        </div>
    </main>

    <script>
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');
        const statsEl = document.getElementById('stats');
        const copyBtn = document.getElementById('copyBtn');

        function isCoord(s) {
            if (!/^\d{1,4}$/.test(s)) return false;
            const n = parseInt(s, 10);
            return n >= 0 && n <= 1200;
        }

        function transformLine(line) {
            const tokens = line.trim().split(/\s+/);
            if (tokens.length < 3) return null;

            // coords already at front
            if (isCoord(tokens[0]) && isCoord(tokens[1])) {
                return tokens[0] + ' ' + tokens[1] + ' ' + tokens.slice(2).join(' ');
            }

            // coords at end
            const y = tokens[tokens.length - 1];
            const x = tokens[tokens.length - 2];
            if (!isCoord(x) || !isCoord(y)) return null;
            return x + ' ' + y + ' ' + tokens.slice(0, tokens.length - 2).join(' ');
        }

        function update() {
            const addComma = document.querySelector('input[name="comma"]:checked').value === 'yes';
            const useCrlf  = document.querySelector('input[name="lineend"]:checked').value === 'crlf';

            const lines = inputEl.value.split(/\r?\n/);
            const results = [];
            let skipped = 0;

            for (const line of lines) {
                if (!line.trim()) continue;
                const out = transformLine(line);
                if (out === null) { skipped++; continue; }
                results.push(addComma ? out + ',' : out);
            }

            const sep = useCrlf ? '\r\n' : '\n';
            outputEl.textContent = results.join(sep);

            const parts = [];
            if (results.length > 0) parts.push(results.length + ' line' + (results.length !== 1 ? 's' : ''));
            if (skipped > 0) parts.push(skipped + ' skipped');
            statsEl.textContent = parts.join(' · ');
        }

        inputEl.addEventListener('input', update);
        document.querySelectorAll('input[type="radio"]').forEach(r => r.addEventListener('change', update));

        copyBtn.addEventListener('click', () => {
            const text = outputEl.textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.classList.remove('copied');
                }, 1500);
            });
        });

        update();
    </script>
</body>
</html>
